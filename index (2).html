<style>

.two{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.lnk{background:none;color:var(--muted);text-decoration:underline;font-size:.85rem}
.al{display:flex;align-items:center;gap:.7rem;padding:.5rem 0;border-bottom:1px solid var(--glass-b);font-size:.85rem}.al img{width:40px;height:40px;object-fit:contain}.al b{flex:1}.al button{background:rgba(239,68,68,.25);color:#fff;padding:.4rem .8rem;border-radius:100px}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,200%);background:var(--pink);color:var(--ink);padding:.8rem 1.4rem;border-radius:100px;font-weight:600;z-index:500;transition:.4s;max-width:92vw;text-align:center}.toast.on{transform:translate(-50%,0)}
.err{color:#fca5a5;font-size:.85rem}
footer{padding:2rem 4%;color:var(--muted);font-size:.85rem;text-align:center;position:relative;z-index:5;background:rgba(0,0,0,.55)}
@media(max-width:1200px){.nav{display:none}#product-img{height:44vh;top:36%}.hero{height:auto;min-height:100vh}.hero-content{flex-direction:column;min-height:calc(100vh - 5rem)}.hero-left{padding:calc(38vh + 3rem) 0 1rem}.hero-right{width:100%;align-items:center;text-align:center;padding:1rem 0 2rem}.product-carousel{align-items:center;padding-top:5rem}.side-title{align-self:center}.main-title,.side-title{font-size:4rem}}
@media(max-width:700px){.header{padding:.8rem 3%}.logo span{display:none}.pill{padding:.6rem .85rem;font-size:.75rem}.tools{gap:.3rem}.pill b{margin-left:.3rem}.two{grid-template-columns:1fr}}
</style>

<script type="module">

const fbCfg={apiKey:"AIzaSyA8x7bftOCJEWDNeeZsUsDoNARidZDRHR8",authDomain:"javabro-d9a4e.firebaseapp.com",projectId:"javabro-d9a4e",storageBucket:"javabro-d9a4e.firebasestorage.app",messagingSenderId:"434122631188",appId:"1:434122631188:web:e34c7f2ec73b52d58d1f01"};
const SUPER_EMAIL='tursunovjavohir159@gmail.com';
const fbApp=initializeApp(fbCfg),auth=getAuth(fbApp),db=getFirestore(fbApp);
let cur=null,adminList=[],openAdminAfter=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};

{id:1,name:'Diet Classic',price:2.99,cat:'Напитки',img:A+'Green%20Soda.png',c1:'#0b8a78',mid:'#044e3b',out:'#011411',desc:'Хрустящий вкус без сахара. Пузырьки в каждом глотке.'},

let products=DEF.map(x=>({...x,builtin:1})),cart=ls.get('orbit_v3_cart',{}),fbProducts=[];

const superBlock=()=>!isSuper()?'':`<h3 style="margin-top:1.5rem">Администраторы</h3><div id="sf" class="fm"><input name="name" placeholder="Имя" maxlength="30"><input name="email" type="email" placeholder="Email нового админа"><input name="pass" type="text" placeholder="Пароль (мин. 6 символов)"><div class="err" id="se"></div><button class="wide" data-act="doAdmin">Добавить администратора</button></div><div class="al"><b>Java</b><span>${esc(SUPER_EMAIL)}</span><span>супер</span></div>${adminList.map(u=>`<div class="al"><b>${esc(u.name||'')}</b><span>${esc(u.email)}</span><button data-act="revoke" data-email="${esc(u.email)}">Снять</button></div>`).join('')}`;

 $('#cards').innerHTML=vs.map(x=>`<div class="card ${x.id==fid?'active':''}" data-act="pick" data-id="${x.id}"><img src="${esc(x.img)}" alt="${esc(x.name)}"${x.dim?' style="filter:brightness(.7)"':''}><div class="card-info"><span>${esc(x.name)}</span><span>${money(x.price)}</span></div></div>`).join('')}
function pick(id){if(isSwitching||id==fid)return;fid=id;renderHero();switchProduct(P(id))}

function switchProduct(p){
 isSwitching=true;const hc=$('#hc');
 gsap.to(document.body,{...colors(p),duration:1.5,ease:'power2.inOut'});
 const so={val:0,blur:0},upd=()=>{switchSpin=so.val;prodImg.style.filter=`blur(${so.blur}px) ${SHADOW}`};

 let done=0;
 allBerries.forEach(berry=>{
  const cx=innerWidth/2-berry.offsetLeft-berry.offsetWidth/2,cy=innerHeight/2-berry.offsetTop-berry.offsetHeight/2;
  const a=parseFloat(berry.dataset.angle)||0,nx=(Math.random()-.5)*200,ny=(Math.random()-.5)*200;
  gsap.set(berry,{rotation:a,x:parseFloat(berry.dataset.baseX)||0,y:parseFloat(berry.dataset.baseY)||0});
  gsap.timeline()
  .to(berry,{x:cx,y:cy,rotation:a+45,scale:.1,opacity:0,duration:.5,ease:'power2.in',onComplete:()=>{berry.src=pimg(p);hc.style.zIndex=50}})
  .to(berry,{duration:.3})
  .to(berry,{onStart:()=>{hc.style.zIndex=1},x:nx,y:ny,rotation:a+90,scale:1,opacity:noPart(p)?0:1,duration:.9,ease:'back.out(1.5)',
   onComplete:()=>{berry.dataset.angle=a+90;berry.dataset.baseX=nx;berry.dataset.baseY=ny;berry.dataset.rx=0;berry.dataset.ry=0;if(++done===allBerries.length)isSwitching=false}})})}

/* ---- мышь / палец ---- */
let mouse={x:0,y:0,px:-999,py:-999},cm={x:0,y:0},last=0;
const move=(x,y)=>{mouse.x=x/innerWidth-.5;mouse.y=y/innerHeight-.5;mouse.px=x;mouse.py=y;last=Date.now()};
addEventListener('mousemove',e=>move(e.clientX,e.clientY));
addEventListener('touchmove',e=>{const t=e.touches[0];if(t)move(t.clientX,t.clientY)},{passive:true});
function animate(){const time=Date.now()*.001;
 if(Date.now()-last>3000){mouse.x=Math.sin(time*.6)*.25;mouse.y=Math.cos(time*.5)*.15;mouse.px=-999;mouse.py=-999}
 cm.x+=(mouse.x-cm.x)*.05;cm.y+=(mouse.y-cm.y)*.05;
 prodImg.style.transform=`translate(-50%,-50%) perspective(900px) rotateY(${cm.x*40+switchSpin}deg) rotateX(${-cm.y*20}deg) rotate(12deg)`;
 berriesFG.style.transform=`translate(${cm.x*60}px,${cm.y*60}px)`;berriesBG.style.transform=`translate(${cm.x*-30}px,${cm.y*-30}px)`;
 if(!isSwitching)allBerries.forEach((berry,i)=>{
  const r=berry.getBoundingClientRect(),dx=mouse.px-(r.left+r.width/2),dy=mouse.py-(r.top+r.height/2),dist=Math.hypot(dx,dy)||1;
  let tx=0,ty=0,sm=1;if(dist<400){const f=(400-dist)/400;tx=dx/dist*f*-80;ty=dy/dist*f*-80;sm=1+f*5}
  let rx=+berry.dataset.rx||0,ry=+berry.dataset.ry||0,ang=+berry.dataset.angle||0,bx=+berry.dataset.baseX||0,by=+berry.dataset.baseY||0;
  rx+=(tx-rx)*.1;ry+=(ty-ry)*.1;ang+=.2*sm;berry.dataset.rx=rx;berry.dataset.ry=ry;berry.dataset.angle=ang;
  const ph=(time+i*.7)*(Math.PI*2/[5,7,6,8,5.5,6.5,9,11,10][i%9]);
  berry.style.transform=`translate(${rx+bx}px,${ry+by+Math.sin(ph)*15}px) rotate(${ang+Math.cos(ph)*6}deg)`});
 requestAnimationFrame(animate)}
animate();
setInterval(()=>{if(document.hidden)return;const b=document.createElement('div'),s=Math.random()*20+10,d=Math.random()*6+4;b.className='bub';b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:-50px;opacity:.4;animation:up ${d}s linear forwards`;$('#bubbles').appendChild(b);setTimeout(()=>b.remove(),d*1000)},400);

/* ---- каталог и корзина ---- */
function renderShop(){const cats=['Все',...new Set(products.map(p=>p.cat))];
 $('#chips').innerHTML=cats.map(c=>`<button class="chip ${c==cat?'on':''}" data-act="cat" data-c="${esc(c)}">${esc(c)}</button>`).join('');
 const l=products.filter(p=>(cat=='Все'||p.cat==cat)&&(p.name+p.desc+p.cat).toLowerCase().includes(query.toLowerCase()));
 $('#grid').innerHTML=l.length?l.map(p=>`<article class="pc"><img src="${esc(p.img)}" alt="${esc(p.name)}"${p.dim?' style="filter:brightness(.7) drop-shadow(0 20px 30px rgba(0,0,0,.5))"':''}><small>${esc(p.cat)}</small><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="row"><span class="price">${money(p.price)}</span><div class="btns"><button class="mini" data-act="view" data-id="${p.id}">Смотреть</button><button class="add" data-act="add" data-id="${p.id}">В корзину</button></div></div></article>`).join(''):'<p class="empty">Ничего не найдено</p>'}
function saveCart(){ls.set('orbit_v3_cart',cart);renderCart()}
function renderCart(){const ids=Object.keys(cart).filter(P);let s=0,n=0;
 $('#items').innerHTML=ids.length?ids.map(id=>{const p=P(id),q=cart[id];s+=p.price*q;n+=q;return`<div class="it"><img src="${esc(p.img)}" alt=""><div><b>${esc(p.name)}</b><br><small>${money(p.price)}</small></div><div class="qty"><button data-act="dec" data-id="${id}">−</button>${q}<button data-act="inc" data-id="${id}">+</button></div></div>`}).join(''):'<p class="empty">Корзина пуста</p>';
 $('#sum').textContent=money(s);$('#cnt').textContent=n}
const addCart=id=>{cart[id]=(cart[id]||0)+1;saveCart();toast('Добавлено: '+P(id).name)};

/* ---- вход, регистрация, админка (Firebase) ---- */
const fd=sel=>{const o={};document.querySelector(sel).querySelectorAll('input,select,textarea').forEach(el=>{o[el.name]=el.type==='file'?el.files[0]:el.type==='checkbox'?el.checked:el.value});return o};
const openModal=h=>{window.onEnter=null;$('#box').innerHTML=h;$('#modal').classList.add('open')};
const closeAll=()=>{$('#modal').classList.remove('open');$('#drawer').classList.remove('open');$('#mask').classList.remove('open')};
const fbErr=c=>({'auth/invalid-credential':'Неверный email или пароль','auth/invalid-email':'Некорректный email','auth/email-already-in-use':'Такой email уже зарегистрирован','auth/weak-password':'Пароль слишком простой (минимум 6 символов)','auth/too-many-requests':'Слишком много попыток, подождите немного','auth/network-request-failed':'Нет интернета','auth/operation-not-allowed':'В Firebase не включён вход по Email/Password','permission-denied':'Нет прав на это действие'}[c]||'Ошибка: '+c);
function authView(mode,err=''){const reg=mode=='reg';
 openModal(`<h3>${reg?'Регистрация':'Вход'}</h3><div id="af" class="fm">${reg?'<input name="name" placeholder="Имя" required>':''}<input name="email" type="email" placeholder="Email" autocomplete="username" required><input name="pass" type="password" placeholder="Пароль (мин. 6 символов)" autocomplete="current-password" required><div class="err">${err}</div><button class="wide" data-act="doAuth">${reg?'Зарегистрироваться':'Войти'}</button><button class="lnk" data-act="${reg?'login':'reg'}">${reg?'Уже есть аккаунт? Войти':'Нет аккаунта? Зарегистрироваться'}</button></div>`);
 window.onEnter=window.doAuth=async()=>{const f=fd('#af');f.email=(f.email||'').trim().toLowerCase();f.pass=(f.pass||'').trim();
  if(!f.email||f.pass.length<6||(reg&&!(f.name||'').trim()))return authView(mode,'Заполните все поля (пароль от 6 символов)');
  try{openAdminAfter=!reg;
   if(reg){const c=await createUserWithEmailAndPassword(auth,f.email,f.pass);await updateProfile(c.user,{displayName:f.name.trim()});cur&&(cur.name=f.name.trim())}
   else await signInWithEmailAndPassword(auth,f.email,f.pass);
   closeAll();toast('Добро пожаловать!')}catch(e){openAdminAfter=false;authView(mode,fbErr(e.code))}}}
const syncAuth=()=>{const u=user();$('#authBtn').textContent=u?u.name:'Войти';$('#authBtn').dataset.act=u?'account':'auth';$('#adminBtn').hidden=!isAdmin()};
onAuthStateChanged(auth,async u=>{
 if(!u){cur=null;syncAuth();return}
 const email=(u.email||'').toLowerCase();let role='user',aname='';
 if(email===SUPER_EMAIL)role='super';else{try{const d=await getDoc(doc(db,'admins',email));if(d.exists()){role='admin';aname=d.data().name||''}}catch(e){}}
 cur={uid:u.uid,email,role,name:u.displayName||aname||(role==='super'?'Java':email.split('@')[0])};syncAuth();
 if(openAdminAfter&&role!=='user')adminView();openAdminAfter=false});
function readImg(file,max){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/webp',.82))};im.src=r.result};r.readAsDataURL(file)})}
async function adminView(){if(!isAdmin())return;
 if(isSuper()){try{adminList=(await getDocs(collection(db,'admins'))).docs.map(d=>({email:d.id,...d.data()}))}catch(e){adminList=[]}}
 openModal(`<h3>Новый товар</h3><div id="pf" class="fm"><input name="name" placeholder="Название" required maxlength="40"><div class="two"><input name="price" type="number" step="0.01" min="0" placeholder="Цена, $" required><input name="cat" placeholder="Категория" required maxlength="24"></div><textarea name="desc" rows="2" placeholder="Описание" maxlength="160"></textarea><label>Фото товара (лучше PNG без фона)<input name="img" type="file" accept="image/*" required></label><label>Логотип для частиц вокруг товара (необязательно)<input name="logo" type="file" accept="image/*"></label><label class="chk"><input name="noPart" type="checkbox"> Без частиц</label><label>Цвет фона страницы для этого товара<input name="c1" type="color" value="#7c3aed"></label><div class="err" id="pe"></div><button class="wide" data-act="doAdd">Добавить в магазин</button></div><h3 style="margin-top:1.5rem">Товары (${products.length})</h3>${products.map(p=>`<div class="al"><img src="${esc(p.img)}" alt=""><b>${esc(p.name)}</b><span>${money(p.price)}</span>${p.builtin?'<span>встроенный</span>':`<button data-act="del" data-id="${esc(p.id)}">Удалить</button>`}</div>`).join('')}${superBlock()}`);
 window.doAdd=async()=>{const f=fd('#pf'),pe=$('#pe');
  if(!f.name.trim()||f.price===''||!f.cat.trim()||!f.img)return pe.textContent='Заполните название, цену, категорию и выберите фото';
  if(!HEX.test(f.c1))return;pe.textContent='Сохраняю…';
  try{const p={name:f.name.trim(),price:Math.max(0,+f.price||0),cat:f.cat.trim(),desc:f.desc.trim(),c1:f.c1,img:await readImg(f.img,640),created:Date.now()};
   if(f.logo&&f.logo.size)p.logo=await readImg(f.logo,256);if(f.noPart)p.noPart=1;
   if(p.img.length+(p.logo||'').length>900000)return pe.textContent='Картинки слишком тяжёлые, выберите поменьше';
   await setDoc(doc(collection(db,'products')),p);adminView();toast('Товар добавлен')}
  catch(x){pe.textContent=x.code==='permission-denied'?'Нет прав на добавление товаров':'Не удалось сохранить товар'}}}
onSnapshot(collection(db,'products'),snap=>{
 fbProducts=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.created||0)-(b.created||0));
 products=[...DEF.map(x=>({...x,builtin:1})),...fbProducts];
 cp=Math.min(cp,Math.max(0,products.length-1));
 if(!P(fid)){fid=products[0].id;renderHero();switchProduct(P(fid))}else renderHero();
 renderShop();renderCart()},()=>toast('Не удалось загрузить товары из базы'));

document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;const id=t.dataset.id;
 const acts={add:()=>addCart(id),addHero:()=>P(fid)&&addCart(fid),pick:()=>pick(id),view:()=>{scrollTo({top:0});pick(id)},cat:()=>{cat=t.dataset.c;renderShop()},
 prev:()=>{cp=(cp-1+products.length)%products.length;renderHero()},next:()=>{cp=(cp+1)%products.length;renderHero()},
 cart:()=>{$('#drawer').classList.add('open');$('#mask').classList.add('open')},close:closeAll,
 inc:()=>{cart[id]++;saveCart()},dec:()=>{if(--cart[id]<=0)delete cart[id];saveCart()},
 checkout:()=>{if(!Object.keys(cart).length)return toast('Корзина пуста');cart={};saveCart();closeAll();toast('Заказ оформлен, спасибо!')},
 doAuth:()=>window.doAuth&&window.doAuth(),doAdd:()=>window.doAdd&&window.doAdd(),
 auth:()=>authView('login'),login:()=>authView('login'),reg:()=>authView('reg'),
 account:()=>{const u=user();openModal(`<h3>${esc(u.name)}</h3><p style="color:var(--muted);margin-bottom:1rem">${esc(u.email)} · ${u.role=='super'?'супер-админ':u.role=='admin'?'администратор':'покупатель'}</p><button class="wide" data-act="logout">Выйти</button>`)},
 logout:()=>{signOut(auth);closeAll()},admin:adminView,
 doAdmin:async()=>{if(!isSuper())return;const f=fd('#sf'),se=$('#se'),email=(f.email||'').trim().toLowerCase(),pass=(f.pass||'').trim(),name=(f.name||'').trim();
  if(!name||!/^\S+@\S+\.\S+$/.test(email)||pass.length<6)return se.textContent='Укажите имя, email и пароль от 6 символов';
  if(email===SUPER_EMAIL)return se.textContent='Это супер-админ';
  se.textContent='Добавляю…';
  try{try{const a2=initializeApp(fbCfg,'sec'+Date.now()),au2=getAuth(a2);const c=await createUserWithEmailAndPassword(au2,email,pass);await updateProfile(c.user,{displayName:name});await signOut(au2)}catch(x){if(x.code!=='auth/email-already-in-use')throw x}
   await setDoc(doc(db,'admins',email),{name,role:'admin'});adminView();toast('Администратор добавлен')}catch(x){se.textContent=fbErr(x.code)}},
 revoke:async()=>{if(!isSuper())return;try{await deleteDoc(doc(db,'admins',t.dataset.email));adminView();toast('Права сняты')}catch(x){toast(fbErr(x.code))}},
 del:async()=>{try{await deleteDoc(doc(db,'products',id));delete cart[id];saveCart();adminView();toast('Товар удалён')}catch(x){toast(fbErr(x.code))}}};
 acts[t.dataset.act]?.()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest&&e.target.closest('#af')&&window.onEnter)window.onEnter()});
$('#modal').addEventListener('click',e=>{if(e.target.id=='modal')closeAll()});
$('#q').addEventListener('input',e=>{query=e.target.value;renderShop()});

/* ---- старт ---- */
const p0=P(fid);
if(p0){Object.entries(colors(p0)).forEach(([k,v])=>document.body.style.setProperty(k,v));prodImg.src=p0.img;if(noPart(p0))allBerries.forEach(b=>b.style.opacity=0)}
renderHero();renderShop();renderCart();syncAuth();
</script>
</body>
